<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleuré — Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="login-wrap">
    <div class="login-box">
      <h1>Fleau<span style="color:var(--rosa-oscuro)">r</span>é</h1>
      <div class="sub">Panel de Administración</div>
      <input type="password" id="passwordInput" placeholder="Contraseña" autofocus>
      <button onclick="login()">Ingresar</button>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" style="display:none">
    <div class="admin-nav">
      <div class="container">
        <a href="/" class="logo">
          <img src="/logo.jpg" alt="Fleuré" class="logo-img">
        </a>
        <a href="/">Ver Tienda</a>
      </div>
    </div>

    <div class="container">
      <div class="admin-header">
        <h2>Administrar Productos</h2>
        <button class="btn btn-primary" onclick="openModal()">+ Nuevo Producto</button>
      </div>

      <div id="adminProducts">
        <div class="loading" style="padding:40px 0;text-align:center;color:var(--gris)">Cargando...</div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal" class="modal-overlay">
    <div class="modal">
      <h3 id="modalTitle">Nuevo Producto</h3>
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>Nombre del producto</label>
        <input id="fieldName" placeholder="Ej: Anillo de Compromiso Eclat">
      </div>
      <div class="form-group">
        <label>Precio ($)</label>
        <input id="fieldPrice" type="number" step="0.01" placeholder="2850.00">
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <textarea id="fieldDesc" placeholder="Describe la pieza..."></textarea>
      </div>
      <div class="form-group">
        <label>Imagen</label>
        <input id="fieldImage" placeholder="https://... o sube una imagen">
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
          <input type="file" id="fileInput" accept="image/*" style="font-size:0.8rem;flex:1">
          <button type="button" class="btn btn-sm btn-outline" onclick="uploadImage()">Subir</button>
        </div>
        <div id="uploadStatus" style="font-size:0.75rem;color:var(--gris);margin-top:4px"></div>
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select id="fieldCategory">
          <option value="Anillos">Anillos</option>
          <option value="Collares">Collares</option>
          <option value="Pendientes">Pendientes</option>
          <option value="Pulseras">Pulseras</option>
          <option value="Relojes">Relojes</option>
          <option value="Otros">Otros</option>
        </select>
      </div>

      <div class="form-group">
        <label>Variantes de color</label>
        <div id="variantsContainer" style="display:flex;flex-direction:column;gap:10px"></div>
        <button type="button" class="btn btn-sm btn-outline" onclick="addVariant()" style="margin-top:8px">+ Agregar variante</button>
      </div>

      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" id="modalSaveBtn" onclick="saveProduct()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const PASSWORD = 'ferisa02';
    let token = null;

    function login() {
      const pw = document.getElementById('passwordInput').value;
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          token = pw;
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          loadProducts();
        } else {
          document.getElementById('loginError').textContent = 'Contraseña incorrecta';
        }
      })
      .catch(() => {
        document.getElementById('loginError').textContent = 'Error de conexión';
      });
    }
    document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        const products = await res.json();
        const container = document.getElementById('adminProducts');
        if (!products.length) {
          container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gris)">No hay productos aún. ¡Agrega el primero!</div>';
          return;
        }
        container.innerHTML = `
          <table class="admin-table">
            <thead>
              <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              ${products.map(p => `
                <tr>
                  <td><img src="${p.image}" alt="${p.name}"></td>
                  <td><strong>${p.name}</strong><br><span style="font-size:0.7rem;color:var(--gris)">${p.category || ''}</span></td>
                  <td>$${p.price.toFixed(2)}</td>
                  <td>${p.soldOut ? '<span style="color:#e74c3c;font-weight:600">Agotado</span>' : '<span style="color:#27ae60;font-weight:600">Disponible</span>'}</td>
                  <td class="actions">
                    <button class="btn btn-sm btn-outline" onclick="editProduct('${p._id}')">Editar</button>
                    <button class="btn btn-sm ${p.soldOut ? 'btn-primary' : 'btn-outline'}" onclick="toggleSold('${p._id}', ${p.soldOut})">${p.soldOut ? 'Disponible' : 'Agotar'}</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteProduct('${p._id}')">Eliminar</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (e) {
        document.getElementById('adminProducts').innerHTML = '<div style="text-align:center;padding:40px;color:red">Error al cargar productos.</div>';
      }
    }

    function openModal(product) {
      document.getElementById('modal').classList.add('active');
      const container = document.getElementById('variantsContainer');
      container.innerHTML = '';
      if (product) {
        document.getElementById('modalTitle').textContent = 'Editar Producto';
        document.getElementById('editId').value = product._id;
        document.getElementById('fieldName').value = product.name;
        document.getElementById('fieldPrice').value = product.price;
        document.getElementById('fieldDesc').value = product.description;
        document.getElementById('fieldImage').value = product.image;
        document.getElementById('fieldCategory').value = product.category || 'Anillos';
        if (product.variants) product.variants.forEach(v => addVariant(v));
      } else {
        document.getElementById('modalTitle').textContent = 'Nuevo Producto';
        document.getElementById('editId').value = '';
        document.getElementById('fieldName').value = '';
        document.getElementById('fieldPrice').value = '';
        document.getElementById('fieldDesc').value = '';
        document.getElementById('fieldImage').value = '';
        document.getElementById('fieldCategory').value = 'Anillos';
      }
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('uploadStatus').textContent = '';
    }

    async function uploadImage() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) { alert('Selecciona una imagen primero'); return; }
      const status = document.getElementById('uploadStatus');
      status.textContent = 'Subiendo...';
      const form = new FormData();
      form.append('image', file);
      form.append('password', token);
      try {
        const res = await fetch('/api/upload', { method: 'POST', body: form });
        const data = await res.json();
        if (data.url) {
          document.getElementById('fieldImage').value = data.url;
          status.textContent = 'Listo';
        } else {
          status.textContent = 'Error al subir';
        }
      } catch (e) {
        status.textContent = 'Error de conexión';
      }
    }

    function getVariants() {
      const rows = document.querySelectorAll('#variantsContainer .variant-row');
      return Array.from(rows).map(row => ({
        name: row.querySelector('.v-name').value,
        color: row.querySelector('.v-color').value,
        image: row.querySelector('.v-image').value
      })).filter(v => v.name);
    }

    function addVariant(data) {
      const container = document.getElementById('variantsContainer');
      const idx = container.children.length;
      const row = document.createElement('div');
      row.className = 'variant-row';
      row.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;background:var(--rosa-polvo);border-radius:10px';
      row.innerHTML = `
        <input class="v-name" placeholder="Nombre" value="${data?.name || ''}" style="flex:1;min-width:80px;padding:8px 10px;border:1px solid var(--gris-claro);border-radius:8px;font-size:0.8rem">
        <input class="v-color" type="color" value="${data?.color || '#D4A0B0'}" style="width:36px;height:36px;border:none;border-radius:6px;cursor:pointer;padding:0">
        <div style="display:flex;gap:4px;flex:1;min-width:140px">
          <input class="v-image" placeholder="URL imagen" value="${data?.image || ''}" style="flex:1;padding:8px 10px;border:1px solid var(--gris-claro);border-radius:8px;font-size:0.8rem">
          <input type="file" accept="image/*" style="display:none" onchange="uploadVariantImage(this, ${idx})">
          <button class="btn btn-sm btn-outline" onclick="this.previousElementSibling.click()" style="white-space:nowrap">Subir</button>
        </div>
        <button class="btn btn-sm btn-danger" onclick="this.closest('.variant-row').remove()" style="padding:4px 8px">&times;</button>
      `;
      container.appendChild(row);
    }

    async function uploadVariantImage(input, idx) {
      const file = input.files[0];
      if (!file) return;
      const form = new FormData();
      form.append('image', file);
      form.append('password', token);
      input.disabled = true;
      try {
        const res = await fetch('/api/upload', { method: 'POST', body: form });
        const data = await res.json();
        if (data.url) input.closest('.variant-row').querySelector('.v-image').value = data.url;
      } catch (e) { alert('Error al subir'); }
      input.disabled = false;
    }

    async function saveProduct() {
      const id = document.getElementById('editId').value;
      const data = {
        password: token,
        name: document.getElementById('fieldName').value.trim(),
        price: document.getElementById('fieldPrice').value,
        description: document.getElementById('fieldDesc').value.trim(),
        image: document.getElementById('fieldImage').value.trim(),
        category: document.getElementById('fieldCategory').value,
        variants: getVariants()
      };
      if (!data.name || !data.price) { alert('Nombre y precio son obligatorios'); return; }
      try {
        if (id) {
          await fetch(`/api/products/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        } else {
          await fetch('/api/products', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        }
        closeModal();
        loadProducts();
      } catch (e) { alert('Error al guardar'); }
    }

    function editProduct(id) {
      fetch('/api/products')
        .then(r => r.json())
        .then(products => {
          const p = products.find(x => x._id === id);
          if (p) openModal(p);
        });
    }

    async function toggleSold(id, current) {
      try {
        await fetch(`/api/products/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: token, soldOut: !current })
        });
        loadProducts();
      } catch (e) { alert('Error al actualizar'); }
    }

    async function deleteProduct(id) {
      if (!confirm('¿Eliminar este producto permanentemente?')) return;
      try {
        await fetch(`/api/products/${id}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: token })
        });
        loadProducts();
      } catch (e) { alert('Error al eliminar'); }
    }

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) closeModal();
    });
  </script>
</body>
</html>
