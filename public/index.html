  <link rel="stylesheet" href="style.css">
  <style>
    .loading { text-align: center; padding: 80px 20px; color: var(--gris); font-size: 0.9rem; }
    .loading::after { content: ''; display: block; width: 30px; height: 30px; margin: 16px auto; border: 2px solid var(--gris-claro); border-top-color: var(--rosa-oscuro); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 60px 20px; color: var(--gris); }
  </style>

  <script>
    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        const products = await res.json();
        const grid = document.getElementById('products');
        if (!products.length) {
          grid.innerHTML = '<div class="empty">No hay productos disponibles por el momento.</div>';
          return;
        }
        grid.innerHTML = products.map(p => {
          const isSold = p.soldOut;
          return `
            <div class="product-card ${isSold ? 'sold-out' : ''}">
              <div class="img-wrap">
                <img src="${p.image}" alt="${p.name}" loading="lazy">
                ${isSold ? '<div class="sold-out-badge">Agotado</div>' : ''}
              </div>
              <div class="info">
                <div class="category">${p.category || 'Joyería'}</div>
                <h3>${p.name}</h3>
                <div class="desc">${p.description}</div>
                <div class="price">
                  $${p.price.toFixed(2)}
                  ${isSold ? '<span class="sold-label">— Agotado</span>' : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        document.getElementById('products').innerHTML = '<div class="empty">Error al cargar productos. Intenta de nuevo.</div>';
      }
    }
    loadProducts();
  </script>
